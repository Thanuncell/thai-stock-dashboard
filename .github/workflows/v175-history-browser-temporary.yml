name: v1.7.5 historical 5Y temporary browser verification

on:
  push:
    branches:
      - codex/v1.7.5-historical-5y-quality

permissions:
  contents: read

jobs:
  historical-5y-browser:
    name: Historical D/W/M browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - run: node test/chart-timeframe.browser.cjs
