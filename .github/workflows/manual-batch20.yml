name: SETscope Manual Coverage 20

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only check or separately Owner-approved execution'
        type: choice
        options:
          - preflight
          - run
        default: preflight
        required: true
      confirmation:
        description: 'Execution requires separate Owner approval: type RUN COVERAGE 20'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: setscope-manual-coverage-20
  cancel-in-progress: false

jobs:
  sequential-coverage:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.run_attempt == 1 && (inputs.mode == 'preflight' || inputs.confirmation == 'RUN COVERAGE 20')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preflight and four sequential durable coverage jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SETSCOPE_BATCH_MODE: ${{ inputs.mode }}
          SETSCOPE_BATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/run-v156-batch20.js
