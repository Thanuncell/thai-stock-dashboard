name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ปลุก Render และตรวจ Supabase
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$APP_URL" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$APP_URL/healthz")
            echo "render attempt $i: $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          test "$code" = "200"
          curl -fsS -o /dev/null -w "supabase keepalive: %{http_code}\n" --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1"
