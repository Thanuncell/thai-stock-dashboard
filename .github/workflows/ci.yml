name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/phase-b-stage1-review

permissions:
  contents: read

jobs:
  production-runtime:
    name: Runtime compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['26.13.0', '26.13.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check

  remembered-security:
    name: Offline session security (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '26.13.0', '26.13.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - name: Install PostgreSQL 17 tools for disposable local clusters
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install -y postgresql-17
          fi
      - name: Verify session security and legacy authentication
        run: npm run test:remembered
      - name: Install verified standalone HTTP test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/setscope-postgrest"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz
          echo "5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/setscope-postgrest"
      - name: Verify PostgreSQL rotation, revocation, RLS and rollback
        env:
          SETSCOPE_PG_BIN: /usr/lib/postgresql/17/bin
          SETSCOPE_POSTGREST_BIN: ${{ runner.temp }}/setscope-postgrest/postgrest
        run: npm run test:remembered:postgres
      - name: Install pinned browser test library
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify Remember ON/OFF in offline browsers
        run: npm run test:remembered:browser

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run check

  archive-query-quality:
    name: Archive query quality (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Verify old index, migration and rebuilt pagination
        env:
          SETSCOPE_QUERY_QUALITY_PG: '{"host":"127.0.0.1","port":5432,"user":"postgres","database":"postgres"}'
        run: npm run test:news-query-quality:postgres17
      - name: Verify stored history and snapshot recovery
        env:
          SETSCOPE_SCREENER_TEST_PG: '{"host":"127.0.0.1","port":5432,"user":"postgres","database":"postgres"}'
        run: npm run test:screener:postgres17

  security-browser:
    name: Mock security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Install pinned browser test library
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run simulated-device security acceptance
        timeout-minutes: 3
        run: npm run test:security:browser
      - name: Run Screener workspace regression
        timeout-minutes: 3
        run: npm run test:screener:browser
      - name: Verify Screener data availability on simulated devices
        timeout-minutes: 3
        run: npm run test:screener:reuse:browser
      - name: Run News navigation and loading regression
        timeout-minutes: 3
        run: npm run test:news-loading:browser
      - name: Run Market Breadth display regression
        timeout-minutes: 3
        run: npm run test:breadth:browser
      - name: Run shared News quality regression
        timeout-minutes: 3
        run: npm run test:news-quality:browser

  technical-browser:
    name: Technical and touch regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Install pinned browser test library
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Check technical test syntax
        run: npm run check:technical
      - name: Run technical browser regression
        timeout-minutes: 5
        run: npm run test:technical:browser
      - name: Run touch and drawing cancellation regression
        timeout-minutes: 5
        run: npm run test:technical:corrective:browser
