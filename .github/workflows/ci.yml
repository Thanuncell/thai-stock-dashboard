name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/phase-b-stage1-review

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run check

  security-browser:
    name: Mock security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Install pinned browser test library
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run simulated-device security acceptance
        timeout-minutes: 3
        run: npm run test:security:browser
      - name: Run News navigation and loading regression
        timeout-minutes: 3
        run: npm run test:news-loading:browser
      - name: Run Market Breadth display regression
        timeout-minutes: 3
        run: npm run test:breadth:browser
      - name: Run shared News quality regression
        timeout-minutes: 3
        run: npm run test:news-quality:browser
